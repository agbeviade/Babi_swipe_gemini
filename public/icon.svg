<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="babiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#042f2e" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#babiGrad)" stroke-width="8" stroke-dasharray="16 12" opacity="0.6" />

  <!-- Swipe Card Layer 1 (Left tilted) -->
  <rect x="140" y="130" width="210" height="270" rx="28" fill="#0f766e" opacity="0.4" transform="rotate(-10 245 265)" />
  
  <!-- Swipe Card Layer 2 (Right tilted) -->
  <rect x="162" y="130" width="210" height="270" rx="28" fill="#f97316" opacity="0.4" transform="rotate(8 267 265)" />

  <!-- Main Front Card -->
  <rect x="151" y="125" width="210" height="270" rx="28" fill="url(#cardGrad)" filter="url(#shadow)" />
  
  <!-- House Roof & Pin Shape inside Card -->
  <path d="M 256 160 L 325 215 L 305 215 L 305 285 L 207 285 L 207 215 L 187 215 Z" fill="#0f766e" />
  <path d="M 238 285 L 238 235 L 274 235 L 274 285 Z" fill="#f97316" />
  
  <!-- Pin Indicator Dot -->
  <circle cx="256" cy="195" r="12" fill="#facc15" />

  <!-- Swipe arrows / gesture hint -->
  <path d="M 175 340 Q 256 375 337 340" fill="none" stroke="#0f766e" stroke-width="6" stroke-linecap="round" />
  <polygon points="340,335 345,348 332,345" fill="#0f766e" />
  <polygon points="172,335 167,348 180,345" fill="#f97316" />
  
  <!-- Brand text badge -->
  <rect x="196" y="300" width="120" height="24" rx="12" fill="#0f766e" />
  <text x="256" y="316" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1">BABI IMMO</text>
</svg>
